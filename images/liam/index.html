<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LIAM PICTURE ARCHIVE</title>
    <style>
        body { margin:0; padding:40px 20px; background:#0d0d12; color:#ffffff; font-family:Arial,sans-serif; display:flex; flex-direction:column; align-items:center; }
        h1 { font-size:24px; letter-spacing:2px; border-bottom:2px solid #fe2c55; padding-bottom:10px; margin-bottom:30px; }
        .grid { max-width:1000px; width:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px; }
        .card { background:#181820; border:1px solid #282835; border-radius:8px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,0.5); display:flex; flex-direction:column; align-items:center; }
        .card img { width:100%; height:220px; object-fit:cover; border-radius:4px; background:#222; }
        .card span { margin-top:12px; font-size:14px; font-weight:bold; color:#eee; }
    </style>
</head>
<body>
    <h1>历代租客的真实人体记录</h1>
    <div class="grid">
        <div class="card"><img src="1.jpg" alt="1.jpg"/><span>Terry</span></div>
        <div class="card"><img src="2.jpg" alt="2.jpg"/><span>Liam</span></div>
        <div class="card"><img src="3.jpg" alt="3.jpg"/><span>vvi11</span></div>
        <div class="card"><img src="4.jpg" alt="4.jpg"/><span>Rowan</span></div>
        <div class="card"><img src="5.jpg" alt="5.jpg"/><span>X</span></div>
    </div>
</body>
</html>
